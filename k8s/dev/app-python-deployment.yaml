apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-python
  namespace: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-python
  template:
    metadata:
      labels:
        app: app-python
    spec:
      containers:
      - name: app-python
        image: host.docker.internal:5000/app-python:be2a42f
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: APP_ENV
          value: "dev"
