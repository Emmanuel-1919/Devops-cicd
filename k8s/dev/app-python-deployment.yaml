apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-python
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-python
  template:
    metadata:
      labels:
        app: app-python
    spec:
      containers:
        - name: app-python
          image: local-registry:5000/app-python:cache-test
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "dev"
